name = "drama-chat-agent"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
# Origin của web được gọi /chat không cần X-Agent-Key (phân tách bằng dấu phẩy).
ALLOWED_ORIGINS = "http://127.0.0.1:5173,http://localhost:5173"
LLM_ORDER = "groq,gemini"
GROQ_MODEL = "qwen/qwen3.8-27b"
GEMINI_MODEL = "gemini-3.5-flash-lite"
LLM_TIMEOUT_MS = "6000"

# Bộ nhớ phiên: Durable Object (đọc ngay thấy lượt vừa ghi; KV cũ nhất quán sau nên bỏ).
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionStore"]

# Secret (không ghi vào file này): GROQ_API_KEYS, GEMINI_API_KEYS, AGENT_API_KEY
# npx wrangler secret put GROQ_API_KEYS
